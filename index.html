<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio Pro">
  <title>Analog LP Turntable v2.0</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      overflow-x: hidden;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #20140d; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 6px solid #2e190b;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(28, 16, 9, 0.85); border: 1px solid rgba(255,255,255,0.12); }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0d0d0f; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 6px solid #3f3f46;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 2px 5px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.9); border: 1px solid #27272a; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 6px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 5px rgba(255,255,255,0.45);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; }

    /* 상단 헤더 */
    .header {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: 1.2px; }
    .ver-tag { font-size: 11px; font-weight: 600; opacity: 0.65; margin-left: 6px; }
    .theme-btns button {
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.28);
      color: inherit;
      cursor: pointer;
      margin-left: 6px;
    }
    body.theme-mint .theme-btns button { background: rgba(255,255,255,0.75); border-color: #94a3b8; }

    /* 메인 작업 영역: 가로형 아이패드 2단 분할 */
    .workspace {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
      min-height: 0;
    }

    /* 좌측: 대형 턴테이블 영역 */
    .left-col {
      flex: 1.15;
      display: flex;
      flex-direction: column;
    }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* LP 레코드판 */
    .platter {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      border: 8px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.11) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning-33 {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    .vinyl.spinning-45 {
      -webkit-animation: spin 2.5s linear infinite;
      animation: spin 2.5s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      border: 4px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .label-text {
      position: absolute;
      top: 18px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }
    .spindle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 32px;
      right: 36px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 8px 18px rgba(0,0,0,0.65);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 28px;
      left: 25px;
      width: 9px;
      height: 235px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.8s ease-in-out;
      transition: transform 0.8s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -26px;
      left: -7px;
      width: 23px;
      height: 20px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -16px;
      left: -6px;
      width: 20px;
      height: 30px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED & RPM 스위치 */
    .deck-bottom-left {
      position: absolute;
      bottom: 22px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 7px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    .rpm-switch {
      display: flex;
      gap: 5px;
    }
    .rpm-btn {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      cursor: pointer;
    }
    .rpm-btn.active {
      background: #d97706;
      border-color: #fbbf24;
    }

    /* 우측: 컨트롤러 + 플레이리스트 2단 구성 */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .panel {
      border-radius: 18px;
      padding: 18px;
    }
    .playlist-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 16px;
    }
    .track-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-source {
      font-size: 12px;
      opacity: 0.75;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #d97706;
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn-main {
      padding: 11px 24px;
      font-size: 15px;
    }
    .btn-sub { background: rgba(120,120,120,0.3); color: inherit; }

    /* 치직거림 믹서 */
    .crackle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(150,150,150,0.2);
      font-size: 13px;
    }
    .crackle-box input[type="range"] { width: 135px; }

    /* 로컬 파일 불러오기 */
    .file-label {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px dashed rgba(150,150,150,0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .file-label:active { opacity: 0.75; }
    #fileInput { display: none; }

    /* 플레이리스트 헤더 및 목록 */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 2px 2px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .clear-all-btn {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(220, 38, 38, 0.6);
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .playlist li {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(120,120,120,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .playlist li.active {
      background: #d97706;
      color: #fff;
      font-weight: bold;
    }
    .track-select-area {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px 4px 0;
      cursor: pointer;
    }
    .del-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .del-btn:active { opacity: 0.7; }

    .empty-guide {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
      margin: auto 0;
      padding: 20px 0;
    }

    /* 세로 모드 또는 모바일 화면 대응 */
    @media (max-width: 768px) {
      body { height: auto; }
      .workspace { flex-direction: column; }
      .deck { min-height: 320px; }
      .platter { width: 250px; height: 250px; }
      .tonearm { height: 180px; }
    }
  </style>
</head>
<body class="theme-wood">

  <div class="header">
    <div class="brand">VINYL STUDIO <span class="ver-tag">v2.0</span></div>
    <div class="theme-btns">
      <button onclick="setTheme('theme-wood')">원목</button>
      <button onclick="setTheme('theme-dark')">다크</button>
      <button onclick="setTheme('theme-mint')">민트</button>
    </div>
  </div>

  <!-- 가로형 아이패드 2단 분할 작업 공간 -->
  <div class="workspace">

    <!-- 좌측: 대형 LP 턴테이블 -->
    <div class="left-col">
      <div class="deck">
        <div class="platter">
          <div class="vinyl-sheen"></div>
          <div class="vinyl" id="vinyl">
            <div class="label" id="vinylLabel">
              <span class="label-text">STEREO</span>
              <div class="spindle"></div>
            </div>
          </div>
        </div>

        <div class="tonearm-base">
          <div class="tonearm" id="tonearm">
            <div class="tonearm-weight"></div>
            <div class="headshell"></div>
          </div>
        </div>

        <div class="deck-bottom-left">
          <div class="power-led">
            <div class="led-dot" id="ledDot"></div>
            <span id="rpmLabel">33 1/3 RPM</span>
          </div>
          <div class="rpm-switch">
            <button class="rpm-btn active" id="btn33" onclick="setRPM(33)">33 RPM</button>
            <button class="rpm-btn" id="btn45" onclick="setRPM(45)">45 RPM</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측: 컨트롤러 및 재생목록 -->
    <div class="right-col">
      <div class="panel">
        <div class="now-playing">
          <div class="track-title" id="trackTitle">재생할 음악을 불러와 주세요</div>
          <div class="track-source" id="trackSource">MP3 · M4A · WAV · FLAC 로컬 음원 전용</div>
        </div>

        <div class="controls">
          <button class="btn btn-sub" onclick="prevTrack()">이전 곡</button>
          <button class="btn btn-main" id="playPauseBtn" onclick="togglePlay()">재생 / 일시정지</button>
          <button class="btn btn-sub" onclick="nextTrack()">다음 곡</button>
        </div>

        <div class="crackle-box">
          <span>아날로그 LP 치직거림 효과 (재생 시 작동)</span>
          <input type="range" id="crackleVol" min="0" max="100" value="25" oninput="updateCrackleVolume(this.value)">
        </div>
      </div>

      <div class="panel playlist-panel">
        <label class="file-label" for="fileInput">
          + 내 기기에서 음악 파일 불러오기 (다중 선택 가능)
        </label>
        <input type="file" id="fileInput" accept="audio/*" multiple onchange="handleFiles(this.files)">

        <div class="playlist-header" id="playlistHeader" style="display:none;">
          <span id="playlistCount">재생목록 (0곡)</span>
          <button type="button" class="clear-all-btn" onclick="clearAllTracks()">전체 삭제</button>
        </div>

        <div class="empty-guide" id="emptyGuide">
          불러온 음악 파일이 여기에 표시됩니다.
        </div>

        <ul class="playlist" id="playlistEl"></ul>
      </div>
    </div>

  </div>

  <audio id="audioPlayer"></audio>

  <script>
    var playlist = [];
    var currentIndex = -1;
    var isPlaying = false;
    var currentRPM = 33;
    var audioPlayer = document.getElementById('audioPlayer');

    // Web Audio API (LP 치직거림 노이즈 - 재생 중일 때만 소리 출력)
    var audioCtx = null;
    var crackleNode = null;
    var crackleGain = null;

    function initCrackle() {
      if (audioCtx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();

      var bufferSize = 2 * audioCtx.sampleRate;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var output = noiseBuffer.getChannelData(0);

      for (var i = 0; i < bufferSize; i++) {
        var r = Math.random();
        if (r > 0.9985) {
          output[i] = (Math.random() * 2 - 1) * 0.45;
        } else {
          output[i] = (Math.random() * 2 - 1) * 0.015;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = noiseBuffer;
      crackleNode.loop = true;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0;

      crackleNode.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);
      crackleNode.start(0);
    }

    function updateCrackleVolume(val) {
      if (crackleGain) {
        if (isPlaying) {
          crackleGain.gain.value = (val / 100) * 0.5;
        } else {
          crackleGain.gain.value = 0;
        }
      }
    }

    function setCrackleActive(active) {
      if (active) {
        initCrackle();
      }
      if (!audioCtx || !crackleGain) return;

      if (active) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var val = document.getElementById('crackleVol').value / 100;
        crackleGain.gain.value = val * 0.5;
      } else {
        crackleGain.gain.value = 0;
      }
    }

    // 테마 변경
    function setTheme(themeName) {
      document.body.className = themeName;
    }

    // 33 / 45 RPM 속도 변경
    function setRPM(rpm) {
      currentRPM = rpm;
      document.getElementById('rpmLabel').innerText = (rpm === 33) ? '33 1/3 RPM' : '45 RPM';
      document.getElementById('btn33').className = (rpm === 33) ? 'rpm-btn active' : 'rpm-btn';
      document.getElementById('btn45').className = (rpm === 45) ? 'rpm-btn active' : 'rpm-btn';

      var rate = (rpm === 33) ? 1.0 : 1.25;
      audioPlayer.playbackRate = rate;

      if (isPlaying) {
        updateTurntableUI(true);
      }
    }

    // 턴테이블 시각 상태 및 치직거림 동기화
    function updateTurntableUI(playing) {
      isPlaying = playing;
      var vinyl = document.getElementById('vinyl');
      var tonearm = document.getElementById('tonearm');
      var led = document.getElementById('ledDot');

      vinyl.classList.remove('spinning-33');
      vinyl.classList.remove('spinning-45');

      if (playing) {
        vinyl.classList.add(currentRPM === 33 ? 'spinning-33' : 'spinning-45');
        tonearm.classList.add('playing');
        led.classList.add('on');
        setCrackleActive(true);
      } else {
        tonearm.classList.remove('playing');
        led.classList.remove('on');
        setCrackleActive(false);
      }
    }

    // 로컬 파일 추가
    function handleFiles(files) {
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var url = URL.createObjectURL(file);
        playlist.push({
          title: file.name.replace(/\.[^/.]+$/, ""),
          url: url
        });
      }
      document.getElementById('fileInput').value = '';
      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0);
      }
    }

    // 개별 트랙 삭제
    function deleteTrack(idx) {
      var removed = playlist[idx];
      if (removed && removed.url) {
        URL.revokeObjectURL(removed.url);
      }

      playlist.splice(idx, 1);

      if (playlist.length === 0) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
        document.getElementById('trackSource').innerText = 'MP3 · M4A · WAV · FLAC 로컬 음원 전용';
      } else if (idx === currentIndex) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '트랙이 삭제되었습니다 (곡을 선택해 주세요)';
        document.getElementById('trackSource').innerText = '대기 중';
      } else if (idx < currentIndex) {
        currentIndex = currentIndex - 1;
      }

      renderPlaylist();
    }

    // 전체 트랙 삭제
    function clearAllTracks() {
      for (var i = 0; i < playlist.length; i++) {
        if (playlist[i].url) {
          URL.revokeObjectURL(playlist[i].url);
        }
      }
      playlist = [];
      currentIndex = -1;
      stopAllPlayback();
      document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
      document.getElementById('trackSource').innerText = 'MP3 · M4A · WAV · FLAC 로컬 음원 전용';
      renderPlaylist();
    }

    // 오디오 재생 정지
    function stopAllPlayback() {
      audioPlayer.pause();
      audioPlayer.src = '';
      updateTurntableUI(false);
    }

    // 플레이리스트 렌더링
    function renderPlaylist() {
      var ul = document.getElementById('playlistEl');
      var header = document.getElementById('playlistHeader');
      var countEl = document.getElementById('playlistCount');
      var emptyGuide = document.getElementById('emptyGuide');

      ul.innerHTML = '';
      if (playlist.length === 0) {
        header.style.display = 'none';
        emptyGuide.style.display = 'block';
        return;
      }

      header.style.display = 'flex';
      emptyGuide.style.display = 'none';
      countEl.innerText = '재생목록 (' + playlist.length + '곡)';

      for (var i = 0; i < playlist.length; i++) {
        (function(idx) {
          var item = playlist[idx];
          var li = document.createElement('li');
          if (idx === currentIndex) li.className = 'active';

          var titleDiv = document.createElement('div');
          titleDiv.className = 'track-select-area';
          titleDiv.innerText = (idx + 1) + '. ' + item.title;
          titleDiv.onclick = function() {
            playTrack(idx);
          };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-btn';
          delBtn.innerText = '삭제';
          delBtn.onclick = function() {
            deleteTrack(idx);
          };

          li.appendChild(titleDiv);
          li.appendChild(delBtn);
          ul.appendChild(li);
        })(i);
      }
    }

    // 트랙 재생 실행
    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;

      currentIndex = index;
      var track = playlist[index];
      renderPlaylist();

      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('trackSource').innerText = '아날로그 바이닐 엔진 재생 중 (' + currentRPM + ' RPM)';

      audioPlayer.src = track.url;
      audioPlayer.playbackRate = (currentRPM === 33) ? 1.0 : 1.25;
      audioPlayer.play();
      updateTurntableUI(true);
    }

    function togglePlay() {
      if (currentIndex === -1) {
        if (playlist.length > 0) playTrack(0);
        return;
      }
      if (audioPlayer.paused) {
        audioPlayer.play();
        updateTurntableUI(true);
        document.getElementById('trackSource').innerText = '아날로그 바이닐 엔진 재생 중 (' + currentRPM + ' RPM)';
      } else {
        audioPlayer.pause();
        updateTurntableUI(false);
        document.getElementById('trackSource').innerText = '일시정지됨';
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      var next = (currentIndex + 1) % playlist.length;
      playTrack(next);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      var prev = (currentIndex - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    audioPlayer.onended = function() {
      nextTrack();
    };
  </script>
</body>
</html>
