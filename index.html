<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio Pro">
  <title>Analog LP Turntable v2.6</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      overflow-x: hidden;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #20140d; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 6px solid #2e190b;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(28, 16, 9, 0.85); border: 1px solid rgba(255,255,255,0.12); }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0d0d0f; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 6px solid #3f3f46;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 2px 5px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.9); border: 1px solid #27272a; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 6px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 5px rgba(255,255,255,0.45);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; }

    /* 상단 헤더 */
    .header {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: 1.2px; }
    .ver-tag { font-size: 11px; font-weight: 600; opacity: 0.65; margin-left: 6px; }
    .theme-btns button {
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.28);
      color: inherit;
      cursor: pointer;
      margin-left: 6px;
    }
    body.theme-mint .theme-btns button { background: rgba(255,255,255,0.75); border-color: #94a3b8; }

    /* 메인 작업 영역: 가로형 아이패드 2단 분할 */
    .workspace {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
      min-height: 0;
    }

    /* 좌측: 대형 턴테이블 영역 */
    .left-col {
      flex: 1.15;
      display: flex;
      flex-direction: column;
    }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* LP 레코드판 */
    .platter {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      border: 8px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.11) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning-33 {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    .vinyl.spinning-45 {
      -webkit-animation: spin 2.5s linear infinite;
      animation: spin 2.5s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      border: 4px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .label-text {
      position: absolute;
      top: 18px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }
    .spindle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 32px;
      right: 36px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 8px 18px rgba(0,0,0,0.65);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 28px;
      left: 25px;
      width: 9px;
      height: 235px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.8s ease-in-out;
      transition: transform 0.8s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -26px;
      left: -7px;
      width: 23px;
      height: 20px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -16px;
      left: -6px;
      width: 20px;
      height: 30px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED & RPM 스위치 */
    .deck-bottom-left {
      position: absolute;
      bottom: 22px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 7px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    .rpm-switch {
      display: flex;
      gap: 5px;
    }
    .rpm-btn {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      cursor: pointer;
    }
    .rpm-btn.active {
      background: #d97706;
      border-color: #fbbf24;
    }

    /* 우측: 컨트롤러 + 플레이리스트 2단 구성 */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .panel {
      border-radius: 18px;
      padding: 16px 18px;
    }
    .playlist-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 12px;
    }
    .track-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-source {
      font-size: 12px;
      opacity: 0.85;
    }

    /* 플레이바 (진행 바 및 시간 표시) */
    .progress-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .time-text {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
      min-width: 36px;
      text-align: center;
    }
    .seek-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(150, 150, 150, 0.35);
      outline: none;
      cursor: pointer;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d97706;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #d97706;
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn-main {
      padding: 10px 20px;
      font-size: 14px;
    }
    .btn-sub { background: rgba(120,120,120,0.3); color: inherit; }
    .btn-repeat {
      background: rgba(120,120,120,0.25);
      color: inherit;
      border: 1px solid rgba(150,150,150,0.35);
      font-size: 12px;
      padding: 10px 12px;
    }
    .btn-repeat.active {
      background: rgba(217, 119, 6, 0.3);
      border-color: #d97706;
      color: #fbbf24;
    }
    body.theme-mint .btn-repeat.active {
      color: #b45309;
    }

    /* 치직거림 믹서 */
    .crackle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(150,150,150,0.2);
      font-size: 13px;
    }
    .crackle-box input[type="range"] { width: 130px; }

    /* 직관적인 파일 추가 버튼 */
    .add-music-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #d97706;
      background: rgba(217, 119, 6, 0.22);
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .add-music-btn:active {
      background: #d97706;
      color: #fff;
    }

    /* 플레이리스트 헤더 및 목록 */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 2px 2px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .clear-all-btn {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(220, 38, 38, 0.6);
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .playlist li {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(120,120,120,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .playlist li.active {
      background: #d97706;
      color: #fff;
      font-weight: bold;
    }
    .track-select-area {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px 4px 0;
      cursor: pointer;
    }
    .del-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .del-btn:active { opacity: 0.7; }

    .empty-guide {
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      margin: auto 0;
      padding: 20px 0;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      body { height: auto; }
      .workspace { flex-direction: column; }
      .deck { min-height: 320px; }
      .platter { width: 250px; height: 250px; }
      .tonearm { height: 180px; }
    }
  </style>
</head>
<body class="theme-wood">

  <div class="header">
    <div class="brand">VINYL STUDIO <span class="ver-tag">v2.6</span></div>
    <div class="theme-btns">
      <button onclick="setTheme('theme-wood')">원목</button>
      <button onclick="setTheme('theme-dark')">다크</button>
      <button onclick="setTheme('theme-mint')">민트</button>
    </div>
  </div>

  <!-- 가로형 아이패드 2단 분할 작업 공간 -->
  <div class="workspace">

    <!-- 좌측: 대형 LP 턴테이블 -->
    <div class="left-col">
      <div class="deck">
        <div class="platter">
          <div class="vinyl-sheen"></div>
          <div class="vinyl" id="vinyl">
            <div class="label" id="vinylLabel">
              <span class="label-text">STEREO</span>
              <div class="spindle"></div>
            </div>
          </div>
        </div>

        <div class="tonearm-base">
          <div class="tonearm" id="tonearm">
            <div class="tonearm-weight"></div>
            <div class="headshell"></div>
          </div>
        </div>

        <div class="deck-bottom-left">
          <div class="power-led">
            <div class="led-dot" id="ledDot"></div>
            <span id="rpmLabel">33 1/3 RPM</span>
          </div>
          <div class="rpm-switch">
            <button class="rpm-btn active" id="btn33" onclick="setRPM(33)">33 RPM</button>
            <button class="rpm-btn" id="btn45" onclick="setRPM(45)">45 RPM</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측: 컨트롤러 및 재생목록 -->
    <div class="right-col">
      <div class="panel">
        <div class="now-playing">
          <div class="track-title" id="trackTitle">재생할 음악을 불러와 주세요</div>
          <div class="track-source" id="trackSource">노래 추가 후 재생 버튼을 누르면 시작됩니다</div>
        </div>

        <!-- 플레이바 (현재 시간 / 탐색 슬라이더 / 전체 시간) -->
        <div class="progress-box">
          <span class="time-text" id="currentTimeText">00:00</span>
          <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" oninput="onSeekInput(this.value)" onchange="onSeekCommit(this.value)">
          <span class="time-text" id="totalTimeText">00:00</span>
        </div>

        <div class="controls">
          <button class="btn btn-sub" onclick="prevTrack()">이전 곡</button>
          <button class="btn btn-main" id="playPauseBtn" onclick="togglePlay()">재생 / 일시정지</button>
          <button class="btn btn-sub" onclick="nextTrack()">다음 곡</button>
          <button class="btn btn-repeat" id="repeatBtn" onclick="cycleRepeatMode()">반복 끔</button>
        </div>

        <div class="crackle-box">
          <span>아날로그 LP 치직거림 효과 (재생 시 작동)</span>
          <input type="range" id="crackleVol" min="0" max="100" value="25" oninput="updateCrackleVolume(this.value)">
        </div>
      </div>

      <div class="panel playlist-panel">
        <button type="button" class="add-music-btn" onclick="openFilePicker()">
          + 음악 파일 불러오기 (MP3 · M4A · WAV · FLAC)
        </button>
        <input type="file" id="fileInput" multiple style="display:none;" onchange="onFilesSelected(this)">

        <div class="playlist-header" id="playlistHeader" style="display:none;">
          <span id="playlistCount">보관함 (0곡)</span>
          <button type="button" class="clear-all-btn" onclick="clearAllTracks()">전체 삭제</button>
        </div>

        <div class="empty-guide" id="emptyGuide">
          저장된 음악이 없습니다.<br>위 주황색 버튼을 눌러 음악을 추가한 뒤 '재생' 버튼을 눌러주세요.
        </div>

        <ul class="playlist" id="playlistEl"></ul>
      </div>
    </div>

  </div>

  <audio id="audioPlayer" preload="auto" playsinline></audio>

  <script>
    var playlist = [];
    var currentIndex = -1;
    var isPlaying = false;
    var currentRPM = 33;
    // 기본값은 'none'(반복 끔) -> 목록이 끝나면 완전히 정지
    var repeatMode = 'none';
    var isSeeking = false;
    var audioPlayer = document.getElementById('audioPlayer');

    // 시간 포맷 변환 (초 -> MM:SS)
    function formatTime(sec) {
      if (!sec || isNaN(sec) || !isFinite(sec)) return '00:00';
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    // 반복 모드 전환 ('none' -> 'all' -> 'one')
    function cycleRepeatMode() {
      var btn = document.getElementById('repeatBtn');
      if (repeatMode === 'none') {
        repeatMode = 'all';
        btn.innerText = '전체 반복';
        btn.className = 'btn btn-repeat active';
      } else if (repeatMode === 'all') {
        repeatMode = 'one';
        btn.innerText = '한 곡 반복';
        btn.className = 'btn btn-repeat active';
      } else {
        repeatMode = 'none';
        btn.innerText = '반복 끔';
        btn.className = 'btn btn-repeat';
      }
      try {
        localStorage.setItem('vinyl_repeat_mode', repeatMode);
      } catch (e) {}
    }

    function applySavedRepeatMode() {
      try {
        var saved = localStorage.getItem('vinyl_repeat_mode');
        if (saved === 'all' || saved === 'one' || saved === 'none') {
          repeatMode = saved;
          var btn = document.getElementById('repeatBtn');
          if (repeatMode === 'all') {
            btn.innerText = '전체 반복';
            btn.className = 'btn btn-repeat active';
          } else if (repeatMode === 'one') {
            btn.innerText = '한 곡 반복';
            btn.className = 'btn btn-repeat active';
          } else {
            btn.innerText = '반복 끔';
            btn.className = 'btn btn-repeat';
          }
        }
      } catch (e) {}
    }

    // 플레이바 탐색 이벤트
    function onSeekInput(val) {
      isSeeking = true;
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        var targetSec = (val / 100) * audioPlayer.duration;
        document.getElementById('currentTimeText').innerText = formatTime(targetSec);
      }
    }

    function onSeekCommit(val) {
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
      }
      isSeeking = false;
    }

    audioPlayer.ontimeupdate = function() {
      if (isSeeking) return;
      var cur = audioPlayer.currentTime || 0;
      var dur = audioPlayer.duration || 0;
      document.getElementById('currentTimeText').innerText = formatTime(cur);
      if (dur > 0 && isFinite(dur)) {
        document.getElementById('totalTimeText').innerText = formatTime(dur);
        document.getElementById('seekSlider').value = Math.floor((cur / dur) * 100);
      }
    };

    audioPlayer.onloadedmetadata = function() {
      var dur = audioPlayer.duration || 0;
      document.getElementById('totalTimeText').innerText = formatTime(dur);
      document.getElementById('seekSlider').value = 0;
      document.getElementById('currentTimeText').innerText = '00:00';
    };

    // 실제 오디오 이벤트와 UI·효과음을 100% 직결 동기화
    audioPlayer.onplay = function() {
      updateTurntableUI(true);
      document.getElementById('trackSource').innerText = '아날로그 바이닐 엔진 재생 중 (' + currentRPM + ' RPM)';
    };

    audioPlayer.onpause = function() {
      // 곡이 끝났을 때 발생하는 자동 pause와 구분해 UI 및 치직거림 즉시 정지
      updateTurntableUI(false);
    };

    audioPlayer.onerror = function() {
      updateTurntableUI(false);
      document.getElementById('trackSource').innerText = '오디오 재생 오류 - 다음 곡을 선택해 주세요';
    };

    // IndexedDB 영구 저장소
    var db = null;
    var DB_NAME = 'VinylStudioDB_v3';
    var STORE_NAME = 'tracks';

    function initDB() {
      if (!window.indexedDB) return;
      try {
        var request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(event) {
          var database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = function(event) {
          db = event.target.result;
          loadSavedTracks();
        };
      } catch (e) {}
    }

    function loadSavedTracks() {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readonly');
        var store = transaction.objectStore(STORE_NAME);
        var request = store.getAll();

        request.onsuccess = function(event) {
          var records = event.target.result || [];
          if (records.length === 0) return;

          for (var i = 0; i < records.length; i++) {
            var rec = records[i];
            var blobUrl = URL.createObjectURL(rec.fileBlob);
            playlist.push({
              dbId: rec.id,
              title: rec.title,
              url: blobUrl
            });
          }
          renderPlaylist();
          if (currentIndex === -1 && playlist.length > 0) {
            document.getElementById('trackTitle').innerText = playlist[0].title;
            document.getElementById('trackSource').innerText = '보관함 복원 완료 (' + playlist.length + '곡) - 재생 버튼을 눌러주세요';
          }
        };
      } catch (e) {}
    }

    function saveTrackInBackground(trackObj, fileBlob) {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        var request = store.add({
          title: trackObj.title,
          fileBlob: fileBlob,
          createdAt: new Date().getTime()
        });
        request.onsuccess = function(ev) {
          trackObj.dbId = ev.target.result;
        };
      } catch (e) {}
    }

    function deleteTrackFromDB(dbId) {
      if (!db || !dbId) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        store.delete(dbId);
      } catch (e) {}
    }

    function clearAllFromDB() {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        store.clear();
      } catch (e) {}
    }

    function openFilePicker() {
      var input = document.getElementById('fileInput');
      input.value = '';
      input.click();
    }

    function onFilesSelected(inputEl) {
      var files = inputEl.files;
      if (!files || files.length === 0) {
        document.getElementById('trackSource').innerText = '선택된 파일이 없습니다.';
        return;
      }

      var addedCount = 0;
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var cleanTitle = file.name.replace(/\.[^/.]+$/, "");
        var blobUrl = URL.createObjectURL(file);

        var newTrack = {
          dbId: null,
          title: cleanTitle,
          url: blobUrl
        };

        playlist.push(newTrack);
        saveTrackInBackground(newTrack, file);
        addedCount++;
      }

      renderPlaylist();

      if (currentIndex === -1 && playlist.length > 0 && !isPlaying) {
        document.getElementById('trackTitle').innerText = playlist[0].title;
      }
      document.getElementById('trackSource').innerText = addedCount + '곡 추가 완료! 재생 버튼을 눌러 시작하세요.';
      inputEl.value = '';
    }

    // Web Audio API (LP 치직거림 노이즈)
    var audioCtx = null;
    var crackleNode = null;
    var crackleGain = null;

    function initCrackle() {
      if (audioCtx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();

      var bufferSize = 2 * audioCtx.sampleRate;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var output = noiseBuffer.getChannelData(0);

      for (var i = 0; i < bufferSize; i++) {
        var r = Math.random();
        if (r > 0.9985) {
          output[i] = (Math.random() * 2 - 1) * 0.45;
        } else {
          output[i] = (Math.random() * 2 - 1) * 0.015;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = noiseBuffer;
      crackleNode.loop = true;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0;

      crackleNode.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);
      crackleNode.start(0);
    }

    function updateCrackleVolume(val) {
      if (crackleGain) {
        if (isPlaying && !audioPlayer.paused) {
          crackleGain.gain.value = (val / 100) * 0.5;
        } else {
          crackleGain.gain.value = 0;
        }
      }
    }

    function setCrackleActive(active) {
      if (active) {
        initCrackle();
      }
      if (!audioCtx || !crackleGain) return;

      if (active) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var val = document.getElementById('crackleVol').value / 100;
        crackleGain.gain.value = val * 0.5;
      } else {
        crackleGain.gain.value = 0;
        if (audioCtx.state === 'running') {
          audioCtx.suspend();
        }
      }
    }

    // 백그라운드 이탈 시 즉시 정지
    function forceStopOnBackground() {
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        document.getElementById('trackSource').innerText = '일시정지됨 (백그라운드 전환)';
      }
      updateTurntableUI(false);
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        forceStopOnBackground();
      }
    });
    window.addEventListener('pagehide', forceStopOnBackground);

    // 테마 변경
    function setTheme(themeName) {
      document.body.className = themeName;
      try {
        localStorage.setItem('vinyl_theme', themeName);
      } catch (e) {}
    }

    // 33 / 45 RPM 속도 변경
    function setRPM(rpm) {
      currentRPM = rpm;
      document.getElementById('rpmLabel').innerText = (rpm === 33) ? '33 1/3 RPM' : '45 RPM';
      document.getElementById('btn33').className = (rpm === 33) ? 'rpm-btn active' : 'rpm-btn';
      document.getElementById('btn45').className = (rpm === 45) ? 'rpm-btn active' : 'rpm-btn';

      var rate = (rpm === 33) ? 1.0 : 1.25;
      audioPlayer.playbackRate = rate;

      if (isPlaying) {
        updateTurntableUI(true);
      }
    }

    // 턴테이블 시각 상태 및 치직거림 동기화
    function updateTurntableUI(playing) {
      isPlaying = playing;
      var vinyl = document.getElementById('vinyl');
      var tonearm = document.getElementById('tonearm');
      var led = document.getElementById('ledDot');

      vinyl.classList.remove('spinning-33');
      vinyl.classList.remove('spinning-45');

      if (playing) {
        vinyl.classList.add(currentRPM === 33 ? 'spinning-33' : 'spinning-45');
        tonearm.classList.add('playing');
        led.classList.add('on');
        setCrackleActive(true);
      } else {
        tonearm.classList.remove('playing');
        led.classList.remove('on');
        setCrackleActive(false);
      }
    }

    function resetProgressBar() {
      document.getElementById('seekSlider').value = 0;
      document.getElementById('currentTimeText').innerText = '00:00';
      document.getElementById('totalTimeText').innerText = '00:00';
    }

    // 개별 트랙 삭제
    function deleteTrack(idx) {
      var removed = playlist[idx];
      if (removed) {
        if (removed.url) URL.revokeObjectURL(removed.url);
        if (removed.dbId) deleteTrackFromDB(removed.dbId);
      }

      playlist.splice(idx, 1);

      if (playlist.length === 0) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
        document.getElementById('trackSource').innerText = '노래 추가 후 재생 버튼을 누르면 시작됩니다';
      } else if (idx === currentIndex) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '트랙이 삭제되었습니다 (곡을 선택해 주세요)';
        document.getElementById('trackSource').innerText = '대기 중';
      } else if (idx < currentIndex) {
        currentIndex = currentIndex - 1;
      }

      renderPlaylist();
    }

    // 전체 트랙 삭제
    function clearAllTracks() {
      for (var i = 0; i < playlist.length; i++) {
        if (playlist[i].url) {
          URL.revokeObjectURL(playlist[i].url);
        }
      }
      playlist = [];
      currentIndex = -1;
      clearAllFromDB();
      stopAllPlayback();
      document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
      document.getElementById('trackSource').innerText = '노래 추가 후 재생 버튼을 누르면 시작됩니다';
      renderPlaylist();
    }

    function stopAllPlayback() {
      audioPlayer.pause();
      audioPlayer.removeAttribute('src');
      audioPlayer.load();
      resetProgressBar();
      updateTurntableUI(false);
    }

    // 플레이리스트 렌더링
    function renderPlaylist() {
      var ul = document.getElementById('playlistEl');
      var header = document.getElementById('playlistHeader');
      var countEl = document.getElementById('playlistCount');
      var emptyGuide = document.getElementById('emptyGuide');

      ul.innerHTML = '';
      if (playlist.length === 0) {
        header.style.display = 'none';
        emptyGuide.style.display = 'block';
        return;
      }

      header.style.display = 'flex';
      emptyGuide.style.display = 'none';
      countEl.innerText = '보관함 (' + playlist.length + '곡)';

      for (var i = 0; i < playlist.length; i++) {
        (function(idx) {
          var item = playlist[idx];
          var li = document.createElement('li');
          if (idx === currentIndex) li.className = 'active';

          var titleDiv = document.createElement('div');
          titleDiv.className = 'track-select-area';
          titleDiv.innerText = (idx + 1) + '. ' + item.title;
          titleDiv.onclick = function() {
            playTrack(idx);
          };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-btn';
          delBtn.innerText = '삭제';
          delBtn.onclick = function() {
            deleteTrack(idx);
          };

          li.appendChild(titleDiv);
          li.appendChild(delBtn);
          ul.appendChild(li);
        })(i);
      }
    }

    // 구형 iOS 사파리 호환 트랙 재생 함수
    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;

      currentIndex = index;
      var track = playlist[index];
      renderPlaylist();

      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('trackSource').innerText = '트랙 불러오는 중...';

      audioPlayer.pause();
      audioPlayer.src = track.url;
      audioPlayer.playbackRate = (currentRPM === 33) ? 1.0 : 1.25;
      audioPlayer.load();

      var playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          updateTurntableUI(true);
        }).catch(function() {
          // 구형 iOS에서 메타데이터 로드 직후 재시도
          setTimeout(function() {
            audioPlayer.play();
          }, 120);
        });
      }
    }

    function togglePlay() {
      if (currentIndex === -1) {
        if (playlist.length > 0) playTrack(0);
        return;
      }
      if (audioPlayer.paused) {
        audioPlayer.play();
        updateTurntableUI(true);
      } else {
        audioPlayer.pause();
        updateTurntableUI(false);
        document.getElementById('trackSource').innerText = '일시정지됨';
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      var next = (currentIndex + 1) % playlist.length;
      playTrack(next);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      var prev = (currentIndex - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    // 곡 종료 시 다음 곡 전환 및 반복 모드 엄격 처리
    audioPlayer.onended = function() {
      // 먼저 UI와 치직거림 효과음을 즉시 차단
      updateTurntableUI(false);

      if (playlist.length === 0) return;

      if (repeatMode === 'one') {
        // 한 곡 반복: 현재 곡 처음부터 다시 재생
        setTimeout(function() {
          audioPlayer.currentTime = 0;
          audioPlayer.play();
        }, 150);
      } else if (repeatMode === 'all') {
        // 전체 반복: 다음 곡으로 이동 (마지막 곡이면 첫 곡으로 순환)
        var nextIdx = (currentIndex + 1) % playlist.length;
        setTimeout(function() {
          playTrack(nextIdx);
        }, 150);
      } else {
        // 반복 끔('none'): 다음 곡이 있으면 이어서 재생하고, 마지막 곡이면 완전히 정지
        if (currentIndex + 1 < playlist.length) {
          var nextSequential = currentIndex + 1;
          setTimeout(function() {
            playTrack(nextSequential);
          }, 150);
        } else {
          // 재생목록 전체 종료 -> 완전히 멈춤
          resetProgressBar();
          document.getElementById('trackSource').innerText = '재생목록 재생 완료 (정지됨)';
        }
      }
    };

    window.onload = function() {
      try {
        var savedTheme = localStorage.getItem('vinyl_theme');
        if (savedTheme) {
          document.body.className = savedTheme;
        }
      } catch (e) {}
      applySavedRepeatMode();
      initDB();
    };
  </script>
</body>
</html>
