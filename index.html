<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio Pro">
  <title>Analog LP Turntable Pro v1.3</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #24170f; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 5px solid #2e190b;
      box-shadow: 0 24px 48px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(26, 15, 8, 0.8); border: 1px solid rgba(255,255,255,0.12); }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0f0f11; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 5px solid #3f3f46;
      box-shadow: 0 24px 48px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.88); border: 1px solid #27272a; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 5px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 4px rgba(255,255,255,0.4);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.88); border: 1px solid #cbd5e1; }

    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
    .ver-tag { font-size: 11px; font-weight: 600; opacity: 0.65; margin-left: 4px; }
    .theme-btns button {
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.25);
      color: inherit;
      cursor: pointer;
      margin-left: 4px;
    }
    body.theme-mint .theme-btns button { background: rgba(255,255,255,0.7); border-color: #94a3b8; }

    /* 턴테이블 데크 */
    .deck {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 340px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* LP 레코드판 및 광택 효과 */
    .platter {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
      border: 6px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning-33 {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    .vinyl.spinning-45 {
      -webkit-animation: spin 2.5s linear infinite;
      animation: spin 2.5s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      background-size: cover;
      background-position: center;
      border: 3px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    }
    .spindle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 24px;
      right: 36px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 24px;
      left: 22px;
      width: 8px;
      height: 190px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.8s ease-in-out;
      transition: transform 0.8s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -22px;
      left: -6px;
      width: 20px;
      height: 18px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -14px;
      left: -5px;
      width: 18px;
      height: 26px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED & RPM 스위치 */
    .deck-bottom-left {
      position: absolute;
      bottom: 18px;
      left: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 6px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
    .rpm-switch {
      display: flex;
      gap: 4px;
    }
    .rpm-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
    }
    .rpm-btn.active {
      background: #d97706;
      border-color: #fbbf24;
    }

    /* 컨트롤 패널 */
    .panel {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .now-playing {
      text-align: center;
      margin-bottom: 14px;
    }
    .track-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-source { font-size: 12px; opacity: 0.75; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #d97706;
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn-sub { background: rgba(120,120,120,0.3); color: inherit; }

    /* 치직거림 믹서 */
    .crackle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(150,150,150,0.2);
      font-size: 13px;
    }
    .crackle-box input[type="range"] { width: 140px; }

    /* 음원 추가 영역 */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(150,150,150,0.4);
      font-size: 14px;
      background: rgba(255,255,255,0.95);
      color: #111;
    }
    .file-label {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed rgba(150,150,150,0.6);
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 10px;
    }
    #fileInput { display: none; }

    /* 플레이리스트 헤더 및 목록 */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 4px 2px;
      font-size: 12px;
      font-weight: 600;
    }
    .clear-all-btn {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(220, 38, 38, 0.6);
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .playlist li {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(120,120,120,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .playlist li.active {
      background: #d97706;
      color: #fff;
      font-weight: bold;
    }
    .track-select-area {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px 4px 0;
      cursor: pointer;
    }
    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.3);
      white-space: nowrap;
    }
    .del-btn {
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .del-btn:active {
      opacity: 0.7;
    }

    /* 유튜브 백그라운드 강제 숨김 (화면 바깥 배치 + 1px 크기) */
    #yt-hidden-container,
    #yt-hidden-container iframe {
      position: fixed !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0.01 !important;
      pointer-events: none !important;
      overflow: hidden !important;
      z-index: -999 !important;
    }
  </style>
</head>
<body class="theme-wood">

  <div class="header">
    <div class="brand">VINYL STUDIO <span class="ver-tag">v1.3</span></div>
    <div class="theme-btns">
      <button onclick="setTheme('theme-wood')">원목</button>
      <button onclick="setTheme('theme-dark')">다크</button>
      <button onclick="setTheme('theme-mint')">민트</button>
    </div>
  </div>

  <!-- 턴테이블 본체 -->
  <div class="deck">
    <div class="platter">
      <div class="vinyl-sheen"></div>
      <div class="vinyl" id="vinyl">
        <div class="label" id="vinylLabel">
          <div class="spindle"></div>
        </div>
      </div>
    </div>

    <div class="tonearm-base">
      <div class="tonearm" id="tonearm">
        <div class="tonearm-weight"></div>
        <div class="headshell"></div>
      </div>
    </div>

    <div class="deck-bottom-left">
      <div class="power-led">
        <div class="led-dot" id="ledDot"></div>
        <span id="rpmLabel">33 1/3 RPM</span>
      </div>
      <div class="rpm-switch">
        <button class="rpm-btn active" id="btn33" onclick="setRPM(33)">33 RPM</button>
        <button class="rpm-btn" id="btn45" onclick="setRPM(45)">45 RPM</button>
      </div>
    </div>
  </div>

  <!-- 화면 바깥으로 완전히 숨겨진 유튜브 오디오 엔진 -->
  <div id="yt-hidden-container">
    <div id="yt-player"></div>
  </div>

  <!-- 메인 컨트롤러 -->
  <div class="panel">
    <div class="now-playing">
      <div class="track-title" id="trackTitle">재생할 음악을 추가해 주세요</div>
      <div class="track-source" id="trackSource">로컬 파일 · 유튜브 곡 · 유튜브 뮤직 재생목록 지원</div>
    </div>

    <div class="controls">
      <button class="btn btn-sub" onclick="prevTrack()">이전 곡</button>
      <button class="btn" id="playPauseBtn" onclick="togglePlay()">재생 / 일시정지</button>
      <button class="btn btn-sub" onclick="nextTrack()">다음 곡</button>
    </div>

    <div class="crackle-box">
      <span>아날로그 LP 치직거림 효과 (재생 시 작동)</span>
      <input type="range" id="crackleVol" min="0" max="100" value="25" oninput="updateCrackleVolume(this.value)">
    </div>
  </div>

  <!-- 음원 추가 및 플레이리스트 -->
  <div class="panel">
    <label class="file-label" for="fileInput">
      + 내 기기에서 음악 파일 불러오기 (MP3, M4A, WAV 등 다중 선택)
    </label>
    <input type="file" id="fileInput" accept="audio/*" multiple onchange="handleFiles(this.files)">

    <div class="input-group">
      <input type="text" id="ytUrlInput" placeholder="유튜브 / 유튜브 뮤직 곡 또는 재생목록(list=) 링크">
      <button class="btn" onclick="addYoutubeLink()">추가</button>
    </div>

    <div class="playlist-header" id="playlistHeader" style="display:none;">
      <span id="playlistCount">재생목록 (0곡)</span>
      <button type="button" class="clear-all-btn" onclick="clearAllTracks()">전체 삭제</button>
    </div>

    <ul class="playlist" id="playlistEl"></ul>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    var playlist = [];
    var currentIndex = -1;
    var isPlaying = false;
    var currentRPM = 33;
    var audioPlayer = document.getElementById('audioPlayer');
    var ytPlayer = null;
    var ytReady = false;
    var pendingTrack = null;

    // Web Audio API (LP 치직거림 노이즈 - 재생 중일 때만 소리 출력)
    var audioCtx = null;
    var crackleNode = null;
    var crackleGain = null;

    function initCrackle() {
      if (audioCtx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();

      var bufferSize = 2 * audioCtx.sampleRate;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var output = noiseBuffer.getChannelData(0);

      for (var i = 0; i < bufferSize; i++) {
        var r = Math.random();
        if (r > 0.9985) {
          output[i] = (Math.random() * 2 - 1) * 0.45;
        } else {
          output[i] = (Math.random() * 2 - 1) * 0.015;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = noiseBuffer;
      crackleNode.loop = true;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0;

      crackleNode.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);
      crackleNode.start(0);
    }

    function updateCrackleVolume(val) {
      if (crackleGain) {
        if (isPlaying) {
          crackleGain.gain.value = (val / 100) * 0.5;
        } else {
          crackleGain.gain.value = 0;
        }
      }
    }

    function setCrackleActive(active) {
      if (active) {
        initCrackle();
      }
      if (!audioCtx || !crackleGain) return;

      if (active) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var val = document.getElementById('crackleVol').value / 100;
        crackleGain.gain.value = val * 0.5;
      } else {
        crackleGain.gain.value = 0;
      }
    }

    // 테마 변경
    function setTheme(themeName) {
      document.body.className = themeName;
    }

    // 33 / 45 RPM 속도 변경
    function setRPM(rpm) {
      currentRPM = rpm;
      document.getElementById('rpmLabel').innerText = (rpm === 33) ? '33 1/3 RPM' : '45 RPM';
      document.getElementById('btn33').className = (rpm === 33) ? 'rpm-btn active' : 'rpm-btn';
      document.getElementById('btn45').className = (rpm === 45) ? 'rpm-btn active' : 'rpm-btn';

      var rate = (rpm === 33) ? 1.0 : 1.25;
      audioPlayer.playbackRate = rate;
      if (ytReady && ytPlayer && ytPlayer.setPlaybackRate) {
        ytPlayer.setPlaybackRate(rate);
      }

      if (isPlaying) {
        updateTurntableUI(true);
      }
    }

    // 턴테이블 시각 상태 및 치직거림 동기화
    function updateTurntableUI(playing) {
      isPlaying = playing;
      var vinyl = document.getElementById('vinyl');
      var tonearm = document.getElementById('tonearm');
      var led = document.getElementById('ledDot');

      vinyl.classList.remove('spinning-33');
      vinyl.classList.remove('spinning-45');

      if (playing) {
        vinyl.classList.add(currentRPM === 33 ? 'spinning-33' : 'spinning-45');
        tonearm.classList.add('playing');
        led.classList.add('on');
        setCrackleActive(true);
      } else {
        tonearm.classList.remove('playing');
        led.classList.remove('on');
        setCrackleActive(false);
      }
    }

    // 로컬 파일 추가
    function handleFiles(files) {
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var url = URL.createObjectURL(file);
        playlist.push({
          type: 'local',
          title: file.name.replace(/\.[^/.]+$/, ""),
          url: url,
          thumb: ''
        });
      }
      document.getElementById('fileInput').value = '';
      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0);
      }
    }

    // 유튜브 URL 정밀 파싱
    function parseYouTubeUrl(url) {
      var listMatch = url.match(/[?&]list=([^#\&\?]+)/);
      var vidMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/)|music\.youtube\.com\/watch\?v=)([^#\&\?]{11})/);
      var videoId = vidMatch ? vidMatch[1] : null;
      var listId = listMatch ? listMatch[1] : null;
      return { videoId: videoId, listId: listId };
    }

    // 유튜브 곡 또는 재생목록 추가
    function addYoutubeLink() {
      var input = document.getElementById('ytUrlInput');
      var url = input.value.trim();
      var parsed = parseYouTubeUrl(url);

      if (!parsed.videoId && !parsed.listId) {
        alert('올바른 유튜브 또는 유튜브 뮤직 링크를 입력해 주세요.');
        return;
      }

      if (parsed.listId && !parsed.videoId) {
        playlist.push({
          type: 'yt_playlist',
          title: 'YouTube 재생목록 (' + parsed.listId.substring(0, 8) + '...)',
          listId: parsed.listId,
          thumb: ''
        });
      } else if (parsed.listId && parsed.videoId) {
        playlist.push({
          type: 'yt_playlist',
          title: 'YouTube 재생목록 스트리밍',
          listId: parsed.listId,
          videoId: parsed.videoId,
          thumb: 'https://img.youtube.com/vi/' + parsed.videoId + '/hqdefault.jpg'
        });
      } else {
        playlist.push({
          type: 'youtube',
          title: 'YouTube 트랙 (' + parsed.videoId + ')',
          videoId: parsed.videoId,
          thumb: 'https://img.youtube.com/vi/' + parsed.videoId + '/hqdefault.jpg'
        });
      }

      input.value = '';
      renderPlaylist();
      if (currentIndex === -1) {
        playTrack(playlist.length - 1);
      }
    }

    // 개별 트랙 삭제
    function deleteTrack(idx) {
      var removed = playlist[idx];
      if (removed && removed.type === 'local' && removed.url) {
        URL.revokeObjectURL(removed.url);
      }

      playlist.splice(idx, 1);

      if (playlist.length === 0) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '재생할 음악을 추가해 주세요';
        document.getElementById('trackSource').innerText = '로컬 파일 · 유튜브 곡 · 유튜브 뮤직 재생목록 지원';
        document.getElementById('vinylLabel').style.backgroundImage = 'none';
      } else if (idx === currentIndex) {
        stopAllPlayback();
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '트랙이 삭제되었습니다 (곡을 선택해 주세요)';
        document.getElementById('trackSource').innerText = '대기 중';
        document.getElementById('vinylLabel').style.backgroundImage = 'none';
      } else if (idx < currentIndex) {
        currentIndex = currentIndex - 1;
      }

      renderPlaylist();
    }

    // 전체 트랙 삭제
    function clearAllTracks() {
      for (var i = 0; i < playlist.length; i++) {
        if (playlist[i].type === 'local' && playlist[i].url) {
          URL.revokeObjectURL(playlist[i].url);
        }
      }
      playlist = [];
      currentIndex = -1;
      stopAllPlayback();
      document.getElementById('trackTitle').innerText = '재생할 음악을 추가해 주세요';
      document.getElementById('trackSource').innerText = '로컬 파일 · 유튜브 곡 · 유튜브 뮤직 재생목록 지원';
      document.getElementById('vinylLabel').style.backgroundImage = 'none';
      renderPlaylist();
    }

    // 모든 오디오 재생 정지
    function stopAllPlayback() {
      audioPlayer.pause();
      audioPlayer.src = '';
      if (ytPlayer && ytReady && ytPlayer.stopVideo) {
        ytPlayer.stopVideo();
      }
      updateTurntableUI(false);
    }

    // 플레이리스트 렌더링 (곡 선택 영역과 삭제 버튼을 완전히 분리)
    function renderPlaylist() {
      var ul = document.getElementById('playlistEl');
      var header = document.getElementById('playlistHeader');
      var countEl = document.getElementById('playlistCount');

      ul.innerHTML = '';
      if (playlist.length === 0) {
        header.style.display = 'none';
        return;
      }

      header.style.display = 'flex';
      countEl.innerText = '재생목록 (' + playlist.length + '곡)';

      for (var i = 0; i < playlist.length; i++) {
        (function(idx) {
          var item = playlist[idx];
          var li = document.createElement('li');
          if (idx === currentIndex) li.className = 'active';

          var badgeText = '내 파일';
          if (item.type === 'youtube') badgeText = 'YT 곡';
          if (item.type === 'yt_playlist') badgeText = 'YT 재생목록';

          // 곡 제목 영역 클릭 시 재생
          var titleDiv = document.createElement('div');
          titleDiv.className = 'track-select-area';
          titleDiv.innerText = (idx + 1) + '. ' + item.title;
          titleDiv.onclick = function() {
            playTrack(idx);
          };

          // 우측 배지 및 독립 삭제 버튼
          var actionDiv = document.createElement('div');
          actionDiv.className = 'track-actions';

          var badgeSpan = document.createElement('span');
          badgeSpan.className = 'badge';
          badgeSpan.innerText = badgeText;

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-btn';
          delBtn.innerText = '삭제';
          delBtn.onclick = function() {
            deleteTrack(idx);
          };

          actionDiv.appendChild(badgeSpan);
          actionDiv.appendChild(delBtn);

          li.appendChild(titleDiv);
          li.appendChild(actionDiv);
          ul.appendChild(li);
        })(i);
      }
    }
