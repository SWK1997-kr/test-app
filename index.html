<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio Pro">
  <title>Analog LP Turntable Pro</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #24170f; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 5px solid #2e190b;
      box-shadow: 0 24px 48px rgba(0,0,0,0.65), inset 0 2px 4px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(26, 15, 8, 0.8); border: 1px solid rgba(255,255,255,0.12); }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0f0f11; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 5px solid #3f3f46;
      box-shadow: 0 24px 48px rgba(0,0,0,0.85), inset 0 2px 4px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.88); border: 1px solid #27272a; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 5px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 4px rgba(255,255,255,0.4);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.88); border: 1px solid #cbd5e1; }

    .header {
      width: 100%;
      max-width: 720px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; }
    .theme-btns button {
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.25);
      color: inherit;
      cursor: pointer;
      margin-left: 4px;
    }
    body.theme-mint .theme-btns button { background: rgba(255,255,255,0.7); border-color: #94a3b8; }

    /* 턴테이블 데크 */
    .deck {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 340px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      overflow: hidden;
    }

    /* LP 레코드판 및 광택 효과 */
    .platter {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
      border: 6px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.1) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning-33 {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    .vinyl.spinning-45 {
      -webkit-animation: spin 2.5s linear infinite;
      animation: spin 2.5s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      background-size: cover;
      background-position: center;
      border: 3px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    }
    .spindle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 24px;
      right: 36px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 24px;
      left: 22px;
      width: 8px;
      height: 190px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.8s ease-in-out;
      transition: transform 0.8s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -22px;
      left: -6px;
      width: 20px;
      height: 18px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -14px;
      left: -5px;
      width: 18px;
      height: 26px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED & RPM 스위치 */
    .deck-bottom-left {
      position: absolute;
      bottom: 18px;
      left: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 6px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
    .rpm-switch {
      display: flex;
      gap: 4px;
    }
    .rpm-btn {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
    }
    .rpm-btn.active {
      background: #d97706;
      border-color: #fbbf24;
    }

    /* 컨트롤 패널 */
    .panel {
      width: 100%;
      max-width: 720px;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .now-playing {
      text-align: center;
      margin-bottom: 14px;
    }
    .track-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-source { font-size: 12px; opacity: 0.75; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
