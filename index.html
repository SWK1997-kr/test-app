<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio">
  <title>Analog LP Turntable v3.0</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      overflow-x: hidden;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #20140d; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 6px solid #2e190b;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(28, 16, 9, 0.85); border: 1px solid rgba(255,255,255,0.12); }
    body.theme-wood .modal-card { background-color: #2c1b11; border: 1px solid rgba(255,255,255,0.2); color: #f5ebe0; }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0d0d0f; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 6px solid #3f3f46;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 2px 5px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.9); border: 1px solid #27272a; }
    body.theme-dark .modal-card { background-color: #18181b; border: 1px solid #3f3f46; color: #f4f4f5; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 6px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 5px rgba(255,255,255,0.45);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; }
    body.theme-mint .modal-card { background-color: #ffffff; border: 1px solid #cbd5e1; color: #1e293b; }

    /* 상단 헤더 */
    .header {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: 1.2px; }
    .ver-tag { font-size: 11px; font-weight: 600; opacity: 0.65; margin-left: 6px; }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.3);
      color: inherit;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn.add-btn {
      background: #d97706;
      border-color: #fbbf24;
      color: #ffffff;
    }
    body.theme-mint .icon-btn:not(.add-btn) {
      background: rgba(255,255,255,0.85);
      border-color: #94a3b8;
    }
    .icon-btn:active { opacity: 0.75; }

    /* 메인 작업 영역: 가로형 아이패드 2단 분할 */
    .workspace {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
      min-height: 0;
    }

    /* 좌측: 대형 턴테이블 영역 */
    .left-col {
      flex: 1.15;
      display: flex;
      flex-direction: column;
    }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* LP 레코드판 */
    .platter {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      border: 8px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.11) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      border: 4px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .label-text {
      position: absolute;
      top: 18px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }
    .spindle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 32px;
      right: 36px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 8px 18px rgba(0,0,0,0.65);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 28px;
      left: 25px;
      width: 9px;
      height: 235px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.7s ease-in-out;
      transition: transform 0.7s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -26px;
      left: -7px;
      width: 23px;
      height: 20px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -16px;
      left: -6px;
      width: 20px;
      height: 30px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED 표시 */
    .deck-bottom-left {
      position: absolute;
      bottom: 22px;
      left: 24px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 7px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }

    /* 우측: 컨트롤러 + 플레이리스트 2단 구성 */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .panel {
      border-radius: 18px;
      padding: 16px 18px;
    }
    .playlist-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 14px;
    }
    .track-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-source {
      font-size: 12px;
      opacity: 0.85;
    }

    /* 플레이바 */
    .progress-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .time-text {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
      min-width: 36px;
      text-align: center;
    }
    .seek-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(150, 150, 150, 0.35);
      outline: none;
      cursor: pointer;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d97706;
      border: 2px solid #fff;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #d97706;
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn-main {
      padding: 10px 20px;
      font-size: 14px;
    }
    .btn-sub { background: rgba(120,120,120,0.3); color: inherit; }
    .btn-repeat {
      background: rgba(120,120,120,0.25);
      color: inherit;
      border: 1px solid rgba(150,150,150,0.35);
      font-size: 12px;
      padding: 10px 12px;
    }
    .btn-repeat.active {
      background: rgba(217, 119, 6, 0.3);
      border-color: #d97706;
      color: #fbbf24;
    }
    body.theme-mint .btn-repeat.active {
      color: #b45309;
    }

    /* 플레이리스트 헤더 및 목록 */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 2px 2px;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .clear-all-btn {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(220, 38, 38, 0.6);
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .playlist li {
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(120,120,120,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .playlist li.active {
      background: #d97706;
      color: #fff;
      font-weight: bold;
    }
    .track-select-area {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px 4px 0;
      cursor: pointer;
    }
    .item-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .order-btn {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.3);
      color: inherit;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.theme-mint .order-btn {
      background: rgba(255,255,255,0.7);
      border-color: #94a3b8;
    }
    .playlist li.active .order-btn {
      background: rgba(0,0,0,0.3);
      color: #fff;
    }
    .order-btn:active { opacity: 0.7; }

    .del-btn {
      padding: 4px 8px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 2px;
    }
    .del-btn:active { opacity: 0.7; }

    .empty-guide {
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      margin: auto 0;
      padding: 20px 0;
      line-height: 1.7;
    }

    /* 설정 모달 팝업 */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.68);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .setting-group {
      margin-bottom: 20px;
    }
    .setting-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      display: block;
    }
    .theme-selector {
      display: flex;
      gap: 8px;
    }
    .theme-option {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(150,150,150,0.35);
      background: rgba(120,120,120,0.15);
      color: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .theme-option.active {
      border-color: #d97706;
      background: rgba(217, 119, 6, 0.28);
    }
    .crackle-slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .crackle-slider-row input[type="range"] {
      flex: 1;
    }
    .modal-close-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #d97706;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { height: auto; }
      .workspace { flex-direction: column; }
      .deck { min-height: 320px; }
      .platter { width: 250px; height: 250px; }
      .tonearm { height: 180px; }
    }
  </style>
</head>
<body class="theme-wood">

  <!-- 상단 헤더: 우측에 '+' 음악 추가 버튼과 '⚙' 설정 버튼 배치 -->
  <div class="header">
    <div class="brand">VINYL STUDIO <span class="ver-tag">v3.0</span></div>
    <div class="header-actions">
      <button type="button" class="icon-btn add-btn" title="음악 파일 불러오기" onclick="openFilePicker()">+</button>
      <button type="button" class="icon-btn" title="설정" onclick="openSettings()">⚙</button>
    </div>
  </div>

  <input type="file" id="fileInput" multiple style="display:none;" onchange="onFilesSelected(this)">

  <!-- 가로형 아이패드 2단 분할 작업 공간 -->
  <div class="workspace">

    <!-- 좌측: 대형 LP 턴테이블 -->
    <div class="left-col">
      <div class="deck">
        <div class="platter">
          <div class="vinyl-sheen"></div>
          <div class="vinyl" id="vinyl">
            <div class="label" id="vinylLabel">
              <span class="label-text">STEREO</span>
              <div class="spindle"></div>
            </div>
          </div>
        </div>

        <div class="tonearm-base">
          <div class="tonearm" id="tonearm">
            <div class="tonearm-weight"></div>
            <div class="headshell"></div>
          </div>
        </div>

        <div class="deck-bottom-left">
          <div class="power-led">
            <div class="led-dot" id="ledDot"></div>
            <span>33 1/3 RPM</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측: 컨트롤러 및 재생목록 -->
    <div class="right-col">
      <div class="panel">
        <div class="now-playing">
          <div class="track-title" id="trackTitle">재생할 음악을 불러와 주세요</div>
          <div class="track-source" id="trackSource">우측 상단 '+' 버튼을 눌러 음악을 추가하세요</div>
        </div>

        <!-- 플레이바 -->
        <div class="progress-box">
          <span class="time-text" id="currentTimeText">00:00</span>
          <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" oninput="onSeekInput(this.value)" onchange="onSeekCommit(this.value)">
          <span class="time-text" id="totalTimeText">00:00</span>
        </div>

        <div class="controls">
          <button class="btn btn-sub" onclick="prevTrack()">이전 곡</button>
          <button class="btn btn-main" id="playPauseBtn" onclick="togglePlay()">재생 / 일시정지</button>
          <button class="btn btn-sub" onclick="nextTrack()">다음 곡</button>
          <button class="btn btn-repeat" id="repeatBtn" onclick="cycleRepeatMode()">반복 끔</button>
        </div>
      </div>

      <div class="panel playlist-panel">
        <div class="playlist-header">
          <span id="playlistCount">보관함 (0곡)</span>
          <button type="button" class="clear-all-btn" id="clearAllBtn" style="display:none;" onclick="clearAllTracks()">전체 삭제</button>
        </div>

        <div class="empty-guide" id="emptyGuide">
          저장된 음악이 없습니다.<br>우측 상단의 '+' 버튼을 눌러 음악을 추가한 뒤 '재생' 버튼을 눌러주세요.
        </div>

        <ul class="playlist" id="playlistEl"></ul>
      </div>
    </div>

  </div>

  <!-- 설정 모달 팝업 (테마 선택 + LP 치직거림 효과) -->
  <div class="modal-backdrop" id="settingsModal" onclick="closeSettingsOnBackdrop(event)">
    <div class="modal-card">
      <div class="modal-title">
        <span>턴테이블 설정</span>
      </div>

      <div class="setting-group">
        <span class="setting-label">턴테이블 테마 선택</span>
        <div class="theme-selector">
          <button type="button" class="theme-option active" id="opt-theme-wood" onclick="setTheme('theme-wood')">원목</button>
          <button type="button" class="theme-option" id="opt-theme-dark" onclick="setTheme('theme-dark')">다크</button>
          <button type="button" class="theme-option" id="opt-theme-mint" onclick="setTheme('theme-mint')">민트</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">아날로그 LP 치직거림 효과음 크기</span>
        <div class="crackle-slider-row">
          <input type="range" id="crackleVol" min="0" max="100" value="25" oninput="updateCrackleVolume(this.value)">
          <span id="crackleVolLabel" style="font-size:12px; min-width:34px; text-align:right;">25%</span>
        </div>
      </div>

      <button type="button" class="modal-close-btn" onclick="closeSettings()">확인</button>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto" playsinline></audio>

  <script>
    var playlist = [];
    var currentIndex = -1;
    var isPlaying = false;
    var repeatMode = 'none';
    var isSeeking = false;
    var isHandlingEnd = false;
    var currentBlobUrl = null;
    var audioPlayer = document.getElementById('audioPlayer');

    // 설정 모달 열기/닫기
    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }
    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }
    function closeSettingsOnBackdrop(e) {
      if (e.target && e.target.id === 'settingsModal') {
        closeSettings();
      }
    }

    // 시간 포맷 변환
    function formatTime(sec) {
      if (!sec || isNaN(sec) || !isFinite(sec)) return '00:00';
      var m = Math.floor(sec / 60);
      var s = Math.floor(sec % 60);
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    // 반복 모드 전환 ('none' -> 'all' -> 'one')
    function cycleRepeatMode() {
      var btn = document.getElementById('repeatBtn');
      if (repeatMode === 'none') {
        repeatMode = 'all';
        btn.innerText = '전체 반복';
        btn.className = 'btn btn-repeat active';
      } else if (repeatMode === 'all') {
        repeatMode = 'one';
        btn.innerText = '한 곡 반복';
        btn.className = 'btn btn-repeat active';
      } else {
        repeatMode = 'none';
        btn.innerText = '반복 끔';
        btn.className = 'btn btn-repeat';
      }
      try {
        localStorage.setItem('vinyl_repeat_mode', repeatMode);
      } catch (e) {}
    }

    function applySavedRepeatMode() {
      try {
        var saved = localStorage.getItem('vinyl_repeat_mode');
        if (saved === 'all' || saved === 'one' || saved === 'none') {
          repeatMode = saved;
          var btn = document.getElementById('repeatBtn');
          if (repeatMode === 'all') {
            btn.innerText = '전체 반복';
            btn.className = 'btn btn-repeat active';
          } else if (repeatMode === 'one') {
            btn.innerText = '한 곡 반복';
            btn.className = 'btn btn-repeat active';
          } else {
            btn.innerText = '반복 끔';
            btn.className = 'btn btn-repeat';
          }
        }
      } catch (e) {}
    }

    // 플레이바 탐색
    function onSeekInput(val) {
      isSeeking = true;
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        var targetSec = (val / 100) * audioPlayer.duration;
        document.getElementById('currentTimeText').innerText = formatTime(targetSec);
      }
    }

    function onSeekCommit(val) {
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
      }
      isSeeking = false;
    }

    // 곡 종료 통합 처리기 (iOS 12 사파리 onended 누락 대비 이중 감시)
    function handleTrackFinished() {
      if (isHandlingEnd) return;
      isHandlingEnd = true;

      if (playlist.length === 0) {
        stopPlaybackCompletely('재생할 음악을 불러와 주세요');
        isHandlingEnd = false;
        return;
      }

      if (repeatMode === 'one') {
        audioPlayer.currentTime = 0;
        var p1 = audioPlayer.play();
        if (p1 && p1.catch) {
          p1.catch(function() {
            stopPlaybackCompletely('일시정지됨');
          });
        }
        setTimeout(function() { isHandlingEnd = false; }, 300);
      } else if (repeatMode === 'all') {
        var nextAllIdx = (currentIndex + 1) % playlist.length;
        isHandlingEnd = false;
        playTrack(nextAllIdx);
      } else {
        // 반복 끔 ('none')
        if (currentIndex + 1 < playlist.length) {
          var nextIdx = currentIndex + 1;
          isHandlingEnd = false;
          playTrack(nextIdx);
        } else {
          // 마지막 곡 완료 -> 오토리턴(완전 정지 및 톤암 복귀)
          stopPlaybackCompletely('재생목록 완료 (오토리턴 정지)');
          isHandlingEnd = false;
        }
      }
    }

    audioPlayer.ontimeupdate = function() {
      if (isSeeking) return;
      var cur = audioPlayer.currentTime || 0;
      var dur = audioPlayer.duration || 0;
      document.getElementById('currentTimeText').innerText = formatTime(cur);

      if (dur > 0 && isFinite(dur)) {
        document.getElementById('totalTimeText').innerText = formatTime(dur);
        document.getElementById('seekSlider').value = Math.floor((cur / dur) * 100);

        // 구형 iOS에서 onended가 누락되는 현상 방지용 끝점 감지
        if (!audioPlayer.paused && (dur - cur) <= 0.25 && dur > 1.0) {
          handleTrackFinished();
        }
      }
    };

    audioPlayer.onloadedmetadata = function() {
      var dur = audioPlayer.duration || 0;
      document.getElementById('totalTimeText').innerText = formatTime(dur);
      document.getElementById('seekSlider').value = 0;
      document.getElementById('currentTimeText').innerText = '00:00';
    };

    audioPlayer.onplay = function() {
      isHandlingEnd = false;
      updateTurntableUI(true);
      document.getElementById('trackSource').innerText = '아날로그 바이닐 엔진 재생 중';
    };

    audioPlayer.onpause = function() {
      updateTurntableUI(false);
    };

    audioPlayer.onended = function() {
      handleTrackFinished();
    };

    audioPlayer.onerror = function() {
      stopPlaybackCompletely('오디오 로드 오류 - 다시 재생해 주세요');
    };

    // IndexedDB 영구 저장소 (순서 정보 order 포함)
    var db = null;
    var DB_NAME = 'VinylStudioDB_v4';
    var STORE_NAME = 'tracks';

    function initDB() {
      if (!window.indexedDB) return;
      try {
        var request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(event) {
          var database = event.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = function(event) {
          db = event.target.result;
          loadSavedTracks();
        };
      } catch (e) {}
    }

    function loadSavedTracks() {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readonly');
        var store = transaction.objectStore(STORE_NAME);
        var request = store.getAll();

        request.onsuccess = function(event) {
          var records = event.target.result || [];
          if (records.length === 0) return;

          // 저장된 order 순서대로 정렬
          records.sort(function(a, b) {
            return (a.order || a.id) - (b.order || b.id);
          });

          playlist = [];
          for (var i = 0; i < records.length; i++) {
            var rec = records[i];
            playlist.push({
              dbId: rec.id,
              title: rec.title,
              blob: rec.fileBlob,
              order: i
            });
          }
          renderPlaylist();
          if (currentIndex === -1 && playlist.length > 0) {
            document.getElementById('trackTitle').innerText = playlist[0].title;
            document.getElementById('trackSource').innerText = '보관함 복원 완료 (' + playlist.length + '곡) - 재생 버튼을 눌러주세요';
          }
        };
      } catch (e) {}
    }

    function saveTrackInBackground(trackObj) {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        var request = store.add({
          title: trackObj.title,
          fileBlob: trackObj.blob,
          order: trackObj.order
        });
        request.onsuccess = function(ev) {
          trackObj.dbId = ev.target.result;
        };
      } catch (e) {}
    }

    // 순서 변경 후 DB 전체 순서 동기화
    function syncPlaylistOrderToDB() {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        for (var i = 0; i < playlist.length; i++) {
          playlist[i].order = i;
          if (playlist[i].dbId) {
            store.put({
              id: playlist[i].dbId,
              title: playlist[i].title,
              fileBlob: playlist[i].blob,
              order: i
            });
          }
        }
      } catch (e) {}
    }

    function deleteTrackFromDB(dbId) {
      if (!db || !dbId) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        store.delete(dbId);
      } catch (e) {}
    }

    function clearAllFromDB() {
      if (!db) return;
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        store.clear();
      } catch (e) {}
    }

    // 파일 선택창 열기 ('+' 버튼)
    function openFilePicker() {
      var input = document.getElementById('fileInput');
      input.value = '';
      input.click();
    }

    // 파일 선택 즉시 추가 (원본 Blob 보관으로 재재생 영구 보장)
    function onFilesSelected(inputEl) {
      var files = inputEl.files;
      if (!files || files.length === 0) return;

      var addedCount = 0;
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        var cleanTitle = file.name.replace(/\.[^/.]+$/, "");
        var newTrack = {
          dbId: null,
          title: cleanTitle,
          blob: file,
          order: playlist.length
        };
        playlist.push(newTrack);
        saveTrackInBackground(newTrack);
        addedCount++;
      }

      renderPlaylist();

      if (currentIndex === -1 && playlist.length > 0 && !isPlaying) {
        document.getElementById('trackTitle').innerText = playlist[0].title;
      }
      if (!isPlaying) {
        document.getElementById('trackSource').innerText = addedCount + '곡 추가 완료! 재생 버튼을 눌러 시작하세요.';
      }
      inputEl.value = '';
    }

    // 재생목록 순서 이동 (위로 / 아래로)
    function moveTrack(idx, direction) {
      var targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= playlist.length) return;

      var temp = playlist[idx];
      playlist[idx] = playlist[targetIdx];
      playlist[targetIdx] = temp;

      // 현재 재생 중인 곡의 인덱스 추적 유지
      if (currentIndex === idx) {
        currentIndex = targetIdx;
      } else if (currentIndex === targetIdx) {
        currentIndex = idx;
      }

      renderPlaylist();
      syncPlaylistOrderToDB();
    }

    // Web Audio API (LP 치직거림 노이즈)
    var audioCtx = null;
    var crackleNode = null;
    var crackleGain = null;

    function initCrackle() {
      if (audioCtx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();

      var bufferSize = 2 * audioCtx.sampleRate;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var output = noiseBuffer.getChannelData(0);

      for (var i = 0; i < bufferSize; i++) {
        var r = Math.random();
        if (r > 0.9985) {
          output[i] = (Math.random() * 2 - 1) * 0.45;
        } else {
          output[i] = (Math.random() * 2 - 1) * 0.015;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = noiseBuffer;
      crackleNode.loop = true;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0;

      crackleNode.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);
      crackleNode.start(0);
    }

    function updateCrackleVolume(val) {
      document.getElementById('crackleVolLabel').innerText = val + '%';
      try {
        localStorage.setItem('vinyl_crackle_vol', val);
      } catch (e) {}

      if (crackleGain) {
        if (isPlaying && !audioPlayer.paused) {
          crackleGain.gain.value = (val / 100) * 0.5;
        } else {
          crackleGain.gain.value = 0;
        }
      }
    }

    function setCrackleActive(active) {
      if (active) {
        initCrackle();
      }
      if (!audioCtx || !crackleGain) return;

      if (active) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var val = document.getElementById('crackleVol').value / 100;
        crackleGain.gain.value = val * 0.5;
      } else {
        crackleGain.gain.value = 0;
        if (audioCtx.state === 'running') {
          audioCtx.suspend();
        }
      }
    }

    // 백그라운드 이탈 시 즉시 정지
    function forceStopOnBackground() {
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        document.getElementById('trackSource').innerText = '일시정지됨 (백그라운드 전환)';
      }
      updateTurntableUI(false);
    }

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        forceStopOnBackground();
      }
    });
    window.addEventListener('pagehide', forceStopOnBackground);

    // 테마 변경 및 설정 모달 버튼 동기화
    function setTheme(themeName) {
      document.body.className = themeName;
      var opts = ['theme-wood', 'theme-dark', 'theme-mint'];
      for (var i = 0; i < opts.length; i++) {
        var el = document.getElementById('opt-' + opts[i]);
        if (el) {
          el.className = (opts[i] === themeName) ? 'theme-option active' : 'theme-option';
        }
      }
      try {
        localStorage.setItem('vinyl_theme', themeName);
      } catch (e) {}
    }

    // 턴테이블 시각 상태 및 치직거림 동기화
    function updateTurntableUI(playing) {
      isPlaying = playing;
      var vinyl = document.getElementById('vinyl');
      var tonearm = document.getElementById('tonearm');
      var led = document.getElementById('ledDot');

      if (playing) {
        vinyl.classList.add('spinning');
        tonearm.classList.add('playing');
        led.classList.add('on');
        setCrackleActive(true);
      } else {
        vinyl.classList.remove('spinning');
        tonearm.classList.remove('playing');
        led.classList.remove('on');
        setCrackleActive(false);
      }
    }

    function resetProgressBar() {
      document.getElementById('seekSlider').value = 0;
      document.getElementById('currentTimeText').innerText = '00:00';
      document.getElementById('totalTimeText').innerText = '00:00';
    }

    // 완전 정지 및 오토리턴 처리
    function stopPlaybackCompletely(statusMessage) {
      audioPlayer.pause();
      try {
        audioPlayer.currentTime = 0;
      } catch (e) {}
      resetProgressBar();
      updateTurntableUI(false);
      if (statusMessage) {
        document.getElementById('trackSource').innerText = statusMessage;
      }
    }

    // 개별 트랙 삭제
    function deleteTrack(idx) {
      var removed = playlist[idx];
      if (removed && removed.dbId) {
        deleteTrackFromDB(removed.dbId);
      }

      playlist.splice(idx, 1);

      if (playlist.length === 0) {
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();
        resetProgressBar();
        updateTurntableUI(false);
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
        document.getElementById('trackSource').innerText = '우측 상단 \'+\' 버튼을 눌러 음악을 추가하세요';
      } else if (idx === currentIndex) {
        stopPlaybackCompletely('트랙이 삭제되었습니다 (곡을 선택해 주세요)');
        currentIndex = -1;
        document.getElementById('trackTitle').innerText = '트랙이 삭제되었습니다';
      } else if (idx < currentIndex) {
        currentIndex = currentIndex - 1;
      }

      renderPlaylist();
      syncPlaylistOrderToDB();
    }

    // 전체 트랙 삭제
    function clearAllTracks() {
      playlist = [];
      currentIndex = -1;
      clearAllFromDB();
      audioPlayer.pause();
      audioPlayer.removeAttribute('src');
      audioPlayer.load();
      resetProgressBar();
      updateTurntableUI(false);
      document.getElementById('trackTitle').innerText = '재생할 음악을 불러와 주세요';
      document.getElementById('trackSource').innerText = '우측 상단 \'+\' 버튼을 눌러 음악을 추가하세요';
      renderPlaylist();
    }

    // 플레이리스트 렌더링 (순서 이동 ▲▼ + 삭제 버튼 포함)
    function renderPlaylist() {
      var ul = document.getElementById('playlistEl');
      var countEl = document.getElementById('playlistCount');
      var clearBtn = document.getElementById('clearAllBtn');
      var emptyGuide = document.getElementById('emptyGuide');

      ul.innerHTML = '';
      countEl.innerText = '보관함 (' + playlist.length + '곡)';

      if (playlist.length === 0) {
        clearBtn.style.display = 'none';
        emptyGuide.style.display = 'block';
        return;
      }

      clearBtn.style.display = 'inline-block';
      emptyGuide.style.display = 'none';

      for (var i = 0; i < playlist.length; i++) {
        (function(idx) {
          var item = playlist[idx];
          var li = document.createElement('li');
          if (idx === currentIndex) li.className = 'active';

          var titleDiv = document.createElement('div');
          titleDiv.className = 'track-select-area';
          titleDiv.innerText = (idx + 1) + '. ' + item.title;
          titleDiv.onclick = function() {
            playTrack(idx);
          };

          var ctrlDiv = document.createElement('div');
          ctrlDiv.className = 'item-controls';

          var upBtn = document.createElement('button');
          upBtn.type = 'button';
          upBtn.className = 'order-btn';
          upBtn.innerText = '▲';
          upBtn.title = '위로 이동';
          upBtn.onclick = function() { moveTrack(idx, -1); };

          var downBtn = document.createElement('button');
          downBtn.type = 'button';
          downBtn.className = 'order-btn';
          downBtn.innerText = '▼';
          downBtn.title = '아래로 이동';
          downBtn.onclick = function() { moveTrack(idx, 1); };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-btn';
          delBtn.innerText = '삭제';
          delBtn.onclick = function() { deleteTrack(idx); };

          ctrlDiv.appendChild(upBtn);
          ctrlDiv.appendChild(downBtn);
          ctrlDiv.appendChild(delBtn);

          li.appendChild(titleDiv);
          li.appendChild(ctrlDiv);
          ul.appendChild(li);
        })(i);
      }
    }

    // 원본 Blob에서 매번 신선한 URL을 생성하여 재생 (재재생 먹통 원천 차단)
    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;

      currentIndex = index;
      var track = playlist[index];
      renderPlaylist();

      document.getElementById('trackTitle').innerText = track.title;
      document.getElementById('trackSource').innerText = '트랙 불러오는 중...';

      audioPlayer.pause();
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }

      currentBlobUrl = URL.createObjectURL(track.blob);
      audioPlayer.src = currentBlobUrl;
      audioPlayer.load();

      var playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          updateTurntableUI(true);
        }).catch(function() {
          setTimeout(function() {
            audioPlayer.play();
          }, 120);
        });
      }
    }

    // 재생 / 일시정지 버튼 (종료 후 다시 눌러도 완벽하게 재시작)
    function togglePlay() {
      if (playlist.length === 0) return;

      if (currentIndex === -1 || !audioPlayer.src) {
        playTrack(0);
        return;
      }

      if (audioPlayer.paused) {
        // 만약 이미 끝까지 재생된 상태에서 다시 재생 버튼을 누른 경우 처음부터 다시 시작
        if (audioPlayer.ended || (audioPlayer.duration > 0 && audioPlayer.currentTime >= audioPlayer.duration - 0.3)) {
          playTrack(currentIndex);
          return;
        }
        var p = audioPlayer.play();
        if (p && p.catch) {
          p.catch(function() {
            playTrack(currentIndex);
          });
        }
      } else {
        audioPlayer.pause();
        document.getElementById('trackSource').innerText = '일시정지됨';
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      var next = (currentIndex + 1) % playlist.length;
      playTrack(next);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      var prev = (currentIndex - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    window.onload = function() {
      try {
        var savedTheme = localStorage.getItem('vinyl_theme');
        if (savedTheme) {
          setTheme(savedTheme);
        }
        var savedVol = localStorage.getItem('vinyl_crackle_vol');
        if (savedVol !== null) {
          document.getElementById('crackleVol').value = savedVol;
          document.getElementById('crackleVolLabel').innerText = savedVol + '%';
        }
      } catch (e) {}
      applySavedRepeatMode();
      initDB();
    };
  </script>
