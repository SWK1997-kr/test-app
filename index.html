<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vinyl Studio Pro">
  <title>Analog LP Turntable v2.2</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 14px 20px;
      overflow-x: hidden;
    }

    /* 테마 1: 클래식 원목 (기본) */
    body.theme-wood { background-color: #20140d; color: #f5ebe0; }
    body.theme-wood .deck {
      background: linear-gradient(145deg, #7c4d2b 0%, #462814 100%);
      border: 6px solid #2e190b;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.15);
    }
    body.theme-wood .panel { background-color: rgba(28, 16, 9, 0.85); border: 1px solid rgba(255,255,255,0.12); }

    /* 테마 2: 모던 다크 스튜디오 */
    body.theme-dark { background-color: #0d0d0f; color: #f4f4f5; }
    body.theme-dark .deck {
      background: linear-gradient(145deg, #27272a 0%, #141417 100%);
      border: 6px solid #3f3f46;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85), inset 0 2px 5px rgba(255,255,255,0.08);
    }
    body.theme-dark .panel { background-color: rgba(24, 24, 27, 0.9); border: 1px solid #27272a; }

    /* 테마 3: 레트로 민트 파스텔 */
    body.theme-mint { background-color: #d6e8e2; color: #1e293b; }
    body.theme-mint .deck {
      background: linear-gradient(145deg, #9fd3c0 0%, #68aa91 100%);
      border: 6px solid #4d8871;
      box-shadow: 0 18px 36px rgba(77,136,113,0.35), inset 0 2px 5px rgba(255,255,255,0.45);
    }
    body.theme-mint .panel { background-color: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; }

    /* 상단 헤더 */
    .header {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: 1.2px; }
    .ver-tag { font-size: 11px; font-weight: 600; opacity: 0.65; margin-left: 6px; }
    .theme-btns button {
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.28);
      color: inherit;
      cursor: pointer;
      margin-left: 6px;
    }
    body.theme-mint .theme-btns button { background: rgba(255,255,255,0.75); border-color: #94a3b8; }

    /* 메인 작업 영역: 가로형 아이패드 2단 분할 */
    .workspace {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: stretch;
      min-height: 0;
    }

    /* 좌측: 대형 턴테이블 영역 */
    .left-col {
      flex: 1.15;
      display: flex;
      flex-direction: column;
    }
    .deck {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* LP 레코드판 */
    .platter {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.8);
      border: 8px solid #262626;
    }
    .vinyl {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        #111111 0,
        #111111 3px,
        #222222 4px,
        #111111 5px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .vinyl-sheen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 50%;
      background: linear-gradient(125deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.11) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .vinyl.spinning-33 {
      -webkit-animation: spin 3.6s linear infinite;
      animation: spin 3.6s linear infinite;
    }
    .vinyl.spinning-45 {
      -webkit-animation: spin 2.5s linear infinite;
      animation: spin 2.5s linear infinite;
    }
    @-webkit-keyframes spin { 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .label {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, #e63946 0%, #8d1d24 100%);
      border: 4px solid #f1faee;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .label-text {
      position: absolute;
      top: 18px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }
    .spindle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #a1a1aa);
      border: 2px solid #3f3f46;
      z-index: 3;
    }

    /* 톤암 (바늘 + 무게추) */
    .tonearm-base {
      position: absolute;
      top: 32px;
      right: 36px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4f4f5, #71717a);
      box-shadow: 0 8px 18px rgba(0,0,0,0.65);
      z-index: 10;
    }
    .tonearm {
      position: absolute;
      top: 28px;
      left: 25px;
      width: 9px;
      height: 235px;
      background: linear-gradient(90deg, #e4e4e7, #9ca3af);
      border-radius: 4px;
      -webkit-transform-origin: top center;
      transform-origin: top center;
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
      -webkit-transition: -webkit-transform 0.8s ease-in-out;
      transition: transform 0.8s ease-in-out;
    }
    .tonearm-weight {
      position: absolute;
      top: -26px;
      left: -7px;
      width: 23px;
      height: 20px;
      background: #27272a;
      border-radius: 3px;
      border: 1px solid #71717a;
    }
    .tonearm.playing {
      -webkit-transform: rotate(27deg);
      transform: rotate(27deg);
    }
    .headshell {
      position: absolute;
      bottom: -16px;
      left: -6px;
      width: 20px;
      height: 30px;
      background: #18181b;
      border-radius: 3px;
      -webkit-transform: rotate(15deg);
      transform: rotate(15deg);
    }

    /* 좌측 하단 전원 LED & RPM 스위치 */
    .deck-bottom-left {
      position: absolute;
      bottom: 22px;
      left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .power-led {
      display: flex;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .led-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #52525b;
      margin-right: 7px;
    }
    .led-dot.on {
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }
    .rpm-switch {
      display: flex;
      gap: 5px;
    }
    .rpm-btn {
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.45);
      color: #fff;
      cursor: pointer;
    }
    .rpm-btn.active {
      background: #d97706;
      border-color: #fbbf24;
    }

    /* 우측: 컨트롤러 + 플레이리스트 2단 구성 */
    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .panel {
      border-radius: 18px;
      padding: 18px;
    }
    .playlist-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 16px;
    }
    .track-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-source {
      font-size: 12px;
      opacity: 0.75;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: #d97706;
      color: #fff;
    }
    .btn:active { opacity: 0.8; }
    .btn-main {
      padding: 11px 24px;
      font-size: 15px;
    }
    .btn-sub { background: rgba(120,120,120,0.3); color: inherit; }

    /* 치직거림 믹서 */
    .crackle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid rgba(150,150,150,0.2);
      font-size: 13px;
    }
    .crackle-box input[type="range"] { width: 135px; }

    /* 로컬 파일 불러오기 (구형 iOS 다중선택 호환) */
    .file-upload-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .file-label {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px dashed rgba(150,150,150,0.6);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .file-label:active { opacity: 0.75; }
    /* 구형 사파리에서 display:none 대신 투명 오버레이 방식 사용 시 터치 인식률 극대화 */
    #fileInput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* 플레이리스트 헤더 및 목록 */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 2px 2px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .clear-all-btn {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid rgba(220, 38, 38, 0.6);
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist {
      list-style: none;
      padding: 0;
      margin: 0;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .playlist li {
      padding: 9px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(120,120,120,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .playlist li.active {
      background: #d97706;
      color: #fff;
      font-weight: bold;
    }
    .track-select-area {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 4px 8px 4px 0;
      cursor: pointer;
    }
    .del-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .del-btn:active { opacity: 0.7; }

    .empty-guide {
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      margin: auto 0;
      padding: 20px 0;
      line-height: 1.6;
    }

    /* 세로 모드 또는 모바일 화면 대응 */
    @media (max-width: 768px) {
      body { height: auto; }
      .workspace { flex-direction: column; }
      .deck { min-height: 320px; }
      .platter { width: 250px; height: 250px; }
      .tonearm { height: 180px; }
    }
  </style>
</head>
<body class="theme-wood">

  <div class="header">
    <div class="brand">VINYL STUDIO <span class="ver-tag">v2.2</span></div>
    <div class="theme-btns">
      <button onclick="setTheme('theme-wood')">원목</button>
      <button onclick="setTheme('theme-dark')">다크</button>
      <button onclick="setTheme('theme-mint')">민트</button>
    </div>
  </div>

  <!-- 가로형 아이패드 2단 분할 작업 공간 -->
  <div class="workspace">

    <!-- 좌측: 대형 LP 턴테이블 -->
    <div class="left-col">
      <div class="deck">
        <div class="platter">
          <div class="vinyl-sheen"></div>
          <div class="vinyl" id="vinyl">
            <div class="label" id="vinylLabel">
              <span class="label-text">STEREO</span>
              <div class="spindle"></div>
            </div>
          </div>
        </div>

        <div class="tonearm-base">
          <div class="tonearm" id="tonearm">
            <div class="tonearm-weight"></div>
            <div class="headshell"></div>
          </div>
        </div>

        <div class="deck-bottom-left">
          <div class="power-led">
            <div class="led-dot" id="ledDot"></div>
            <span id="rpmLabel">33 1/3 RPM</span>
          </div>
          <div class="rpm-switch">
            <button class="rpm-btn active" id="btn33" onclick="setRPM(33)">33 RPM</button>
            <button class="rpm-btn" id="btn45" onclick="setRPM(45)">45 RPM</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측: 컨트롤러 및 영구 저장 재생목록 -->
    <div class="right-col">
      <div class="panel">
        <div class="now-playing">
          <div class="track-title" id="trackTitle">재생할 음악을 불러와 주세요</div>
          <div class="track-source" id="trackSource">추가한 음악은 기기에 자동 저장됩니다</div>
        </div>

        <div class="controls">
          <button class="btn btn-sub" onclick="prevTrack()">이전 곡</button>
          <button class="btn btn-main" id="playPauseBtn" onclick="togglePlay()">재생 / 일시정지</button>
          <button class="btn btn-sub" onclick="nextTrack()">다음 곡</button>
        </div>

        <div class="crackle-box">
          <span>아날로그 LP 치직거림 효과 (재생 시 작동)</span>
          <input type="range" id="crackleVol" min="0" max="100" value="25" oninput="updateCrackleVolume(this.value)">
        </div>
      </div>

      <div class="panel playlist-panel">
        <div class="file-upload-wrapper">
          <div class="file-label">+ 내 기기에서 음악 파일 불러오기 (다중 선택 지원)</div>
          <!-- 구형 iOS 사파리 다중 선택 잠금 해제를 위해 accept 제한 제거 후 JS에서 오디오만 필터링 -->
          <input type="file" id="fileInput" multiple="multiple" onchange="handleFiles(this.files)">
        </div>

        <div class="playlist-header" id="playlistHeader" style="display:none;">
          <span id="playlistCount">보관함 (0곡)</span>
          <button type="button" class="clear-all-btn" onclick="clearAllTracks()">전체 삭제</button>
        </div>

        <div class="empty-guide" id="emptyGuide">
          저장된 음악이 없습니다.<br>위 버튼을 누르고 파일 앱 우측 상단 '선택'을 눌러 여러 곡을 한 번에 추가하세요.
        </div>

        <ul class="playlist" id="playlistEl"></ul>
      </div>
    </div>

  </div>

  <audio id="audioPlayer"></audio>

  <script>
    var playlist = [];
    var currentIndex = -1;
    var isPlaying = false;
    var currentRPM = 33;
    var audioPlayer = document.getElementById('audioPlayer');

    // IndexedDB 영구 저장소 설정 (iOS 12 사파리 완벽 호환)
    var db = null;
    var DB_NAME = 'VinylStudioDB';
    var STORE_NAME = 'tracks';

    function initDB(callback) {
      if (!window.indexedDB) {
        if (callback) callback();
        return;
      }
      var request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function(event) {
        var database = event.target.result;
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = function(event) {
        db = event.target.result;
        loadSavedTracks(callback);
      };
      request.onerror = function() {
        if (callback) callback();
      };
    }

    // 앱 실행 시 저장된 음악 목록 자동 복원
    function loadSavedTracks(callback) {
      if (!db) return;
      var transaction = db.transaction([STORE_NAME], 'readonly');
      var store = transaction.objectStore(STORE_NAME);
      var request = store.getAll();

      request.onsuccess = function(event) {
        var records = event.target.result || [];
        playlist = [];
        for (var i = 0; i < records.length; i++) {
          var rec = records[i];
          var blobUrl = URL.createObjectURL(rec.fileBlob);
          playlist.push({
            dbId: rec.id,
            title: rec.title,
            url: blobUrl
          });
        }
        renderPlaylist();
        if (playlist.length > 0) {
          document.getElementById('trackTitle').innerText = playlist[0].title;
          document.getElementById('trackSource').innerText = '저장된 보관함 불러오기 완료 (' + playlist.length + '곡)';
        }
        if (callback) callback();
      };
    }

    // 새 음원 파일을 IndexedDB에 저장
    function saveTrackToDB(title, fileBlob, callback) {
      if (!db) {
        if (callback) callback(null);
        return;
      }
      try {
        var transaction = db.transaction([STORE_NAME], 'readwrite');
        var store = transaction.objectStore(STORE_NAME);
        var request = store.add({
          title: title,
          fileBlob: fileBlob,
          createdAt: new Date().getTime()
        });

        request.onsuccess = function(event) {
          if (callback) callback(event.target.result);
        };
        request.onerror = function() {
          if (callback) callback(null);
        };
      } catch (e) {
        if (callback) callback(null);
      }
    }

    // 개별 트랙 DB에서 삭제
    function deleteTrackFromDB(dbId) {
      if (!db || !dbId) return;
      var transaction = db.transaction([STORE_NAME], 'readwrite');
      var store = transaction.objectStore(STORE_NAME);
      store.delete(dbId);
    }

    // 전체 트랙 DB 비우기
    function clearAllFromDB() {
      if (!db) return;
      var transaction = db.transaction([STORE_NAME], 'readwrite');
      var store = transaction.objectStore(STORE_NAME);
      store.clear();
    }

    // Web Audio API (LP 치직거림 노이즈 - 재생 중일 때만 소리 출력)
    var audioCtx = null;
    var crackleNode = null;
    var crackleGain = null;

    function initCrackle() {
      if (audioCtx) return;
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();

      var bufferSize = 2 * audioCtx.sampleRate;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var output = noiseBuffer.getChannelData(0);

      for (var i = 0; i < bufferSize; i++) {
        var r = Math.random();
        if (r > 0.9985) {
          output[i] = (Math.random() * 2 - 1) * 0.45;
        } else {
          output[i] = (Math.random() * 2 - 1) * 0.015;
        }
      }

      crackleNode = audioCtx.createBufferSource();
      crackleNode.buffer = noiseBuffer;
      crackleNode.loop = true;

      crackleGain = audioCtx.createGain();
      crackleGain.gain.value = 0;

      crackleNode.connect(crackleGain);
      crackleGain.connect(audioCtx.destination);
      crackleNode.start(0);
    }

    function updateCrackleVolume(val) {
      if (crackleGain) {
        if (isPlaying) {
          crackleGain.gain.value = (val / 100) * 0.5;
        } else {
          crackleGain.gain.value = 0;
        }
      }
    }

    function setCrackleActive(active) {
      if (active) {
        initCrackle();
      }
      if (!audioCtx || !crackleGain) return;

      if (active) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        var val = document.getElementById('crackleVol').value / 100;
        crackleGain.gain.value = val * 0.5;
      } else {
        crackleGain.gain.value = 0;
      }
    }

    function setTheme(themeName) {
      document.body.className = themeName;
      try {
        localStorage.setItem('vinyl_theme', themeName);
      } catch (e) {}
    }
